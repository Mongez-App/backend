spring:
  application:
    name: ai-worker
  datasource:
    url: jdbc:postgresql://localhost:5432/ai_db
    username: smartstudy
    password: smartstudy
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: localhost
    port: 5672
    username: smartstudy
    password: smartstudy

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

# TODO: LLM provider credentials (e.g. GEMINI_API_KEY) come from env vars — never commit keys.
