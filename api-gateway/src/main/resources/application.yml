server:
  port: ${PORT:8080}
  address: 0.0.0.0

spring:
  application:
    name: api-gateway
  codec:
    max-in-memory-size: 25MB
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true
      routes:
        - id: identity-service
          uri: lb://IDENTITY-SERVICE
          predicates:
            - name: Path
              args:
                 patterns:
                   - /api/v1/auth
                   - /api/v1/auth/**
                   - /api/v1/users
                   - /api/v1/users/**
                   - /api/v1/organization/auth
                   - /api/v1/organization/auth/**
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: identityCircuitBreaker
                fallbackUri: forward:/fallback/identity

        - id: planning-service
          uri: lb://PLANNING-SERVICE
          predicates:
            - name: Path
              args:
                 patterns:
                    - /api/v1/calendar/events
                    - /api/v1/calendar/events/**
                    - /api/v1/tasks
                    - /api/v1/tasks/**
                    - /api/v1/courses
                    - /api/v1/courses/**
                    - /api/v1/materials
                    - /api/v1/materials/**
                    - /api/v1/roadmap
                    - /api/v1/roadmap/**
                    - /api/v1/sessions
                    - /api/v1/sessions/**
                    - /api/v1/home
                    - /api/v1/home/**
                    - /api/v1/upload
                    - /api/v1/upload/**
                    - /api/v1/organization
                    - /api/v1/organization/**
          filters:
            - StripPrefix=2
            - name: RequestSize
              args:
                maxSize: 25MB
            - name: CircuitBreaker
              args:
                name: planningCircuitBreaker
                fallbackUri: forward:/fallback/planning
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}

resilience4j:
  circuitbreaker:
    instances:
      identityCircuitBreaker:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
      planningCircuitBreaker:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
  timelimiter:
    instances:
      identityCircuitBreaker:
        timeoutDuration: 3s
      planningCircuitBreaker:
        timeoutDuration: 60s

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS:}
  credentials-json: ${FIREBASE_CREDENTIALS_JSON:}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info, gateway
  endpoint:
    health:
      show-details: never