server:
  port: ${PORT:8080}
  address: 0.0.0.0

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: identity-service
          uri: lb://IDENTITY-SERVICE
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**, /api/v1/preferences/**
          filters:
            - name: CircuitBreaker
              args:
                name: identityCircuitBreaker
                fallbackUri: forward:/fallback/identity
        - id: planning-service
          uri: lb://PLANNING-SERVICE
          predicates:
            - Path=/api/v1/tasks/**, /api/v1/courses/**, /api/v1/materials/**, /api/v1/roadmap/**, /api/v1/sessions/**, /api/v1/calendar/**, /api/v1/home/**
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: planningCircuitBreaker
                fallbackUri: forward:/fallback/planning
        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/v1/devices/**, /api/v1/push/**
          filters:
            - name: CircuitBreaker
              args:
                name: notificationCircuitBreaker
                fallbackUri: forward:/fallback/notification

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
