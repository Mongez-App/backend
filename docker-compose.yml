services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: smartstudy-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartstudy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartstudy}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartstudy}"]
      interval: 5s
      timeout: 5s
      retries: 10

  eureka:
    build:
      context: .
      dockerfile: eureka/Dockerfile
    container_name: smartstudy-eureka
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:-http://eureka:8761/eureka/}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: smartstudy-api-gateway
    ports:
      - "8080:8080"
    volumes:
      - ./credentials:/app/credentials:ro
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:-http://eureka:8761/eureka/}
      - EUREKA_INSTANCE_HOSTNAME=api-gateway
      - FIREBASE_CREDENTIALS=${FIREBASE_CREDENTIALS:-/app/credentials/firebase-admin.json}
    depends_on:
      eureka:
        condition: service_healthy

  identity-service:
    build:
      context: .
      dockerfile: identity-service/Dockerfile
    container_name: smartstudy-identity-service
    ports:
      - "8081:8081"
    volumes:
      - ./credentials:/app/credentials:ro
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-smartstudy}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-smartstudy}
      - IDENTITY_DB_NAME=${IDENTITY_DB_NAME:-identity_db}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:-http://eureka:8761/eureka/}
      - EUREKA_INSTANCE_HOSTNAME=identity-service
      - FIREBASE_CREDENTIALS=${FIREBASE_CREDENTIALS:-/app/credentials/firebase-admin.json}
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_healthy

  planning-service:
    build:
      context: .
      dockerfile: planning-service/Dockerfile
    container_name: smartstudy-planning-service
    # No ports exposed externally — Planning Service is only accessible
    # via internal Docker network. All external traffic must go through
    # API Gateway (port 8080). This prevents X-User-Id spoofing.
    volumes:
      - material_uploads:/app/uploads/materials
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-smartstudy}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-smartstudy}
      - PLANNING_DB_NAME=${PLANNING_DB_NAME:-planning_db}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:-http://eureka:8761/eureka/}
      - EUREKA_INSTANCE_HOSTNAME=planning-service
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6334
      - MATERIAL_STORAGE_DIR=/app/uploads/materials
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_healthy
      qdrant:
        condition: service_started

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: smartstudy-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  material_uploads:
  qdrant_data: