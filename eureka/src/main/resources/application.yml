server:
  port: ${PORT:8761}
  address: 0.0.0.0

spring:
  application:
    name: eureka-server

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  server:
    enable-self-preservation: ${EUREKA_ENABLE_SELF_PRESERVATION:false}
