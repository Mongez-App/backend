spring:
  application:
    name: identity-service
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
  datasource:
    # Resolves local POSTGRES_HOST first, then Railway's PGHOST, then falls back to localhost
    url: jdbc:postgresql://${POSTGRES_HOST:${PGHOST:localhost}}:${POSTGRES_PORT:${PGPORT:5432}}/${IDENTITY_DB_NAME:${PGDATABASE:identity_db}}
    username: ${POSTGRES_USER:${PGUSER:smartstudy}}
    password: ${POSTGRES_PASSWORD:${PGPASSWORD:smartstudy}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: false

server:
  port: ${PORT:8081}
  address: 0.0.0.0

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: false
    fetch-registry: false
  instance:
    prefer-ip-address: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS:/app/credentials/firebase-admin.json}