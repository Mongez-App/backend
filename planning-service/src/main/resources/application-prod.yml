spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${PLANNING_DB_NAME:planning_db}
    username: ${POSTGRES_USER:smartstudy}
    password: ${POSTGRES_PASSWORD:smartstudy}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
  ai:
    google:
      genai:
        api-key: ${SPRING_AI_GOOGLE_GEMINI_API_KEY:AQ.Ab8RN6Jbj7pNOghKahel8kjLenveDQvI0X0dZDjgOSaEGc7Niw}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:planning-service.railway.internal}

# --- AI Processing Pipeline ---
gemini:
  api-key: ${GEMINI_API_KEY:AQ.Ab8RN6Jbj7pNOghKahel8kjLenveDQvI0X0dZDjgOSaEGc7Niw}
  chat:
    model: ${GEMINI_CHAT_MODEL:gemini-2.0-flash}

openrouter:
  api-key: ${OPENROUTER_API_KEY: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}
  base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}

# Uploaded PDFs must live on the mounted Railway volume, not the container's
# own filesystem, which is recreated on every deploy.
storage:
  materials:
    base-dir: ${MATERIAL_STORAGE_DIR:/data/materials}

# Qdrant runs as its own Railway service (with its own volume) and is reached
# over the private network.
qdrant:
  host: ${QDRANT_HOST:qdrant.railway.internal}
  port: ${QDRANT_PORT:6334}