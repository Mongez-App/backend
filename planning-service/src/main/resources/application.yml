spring:
  application:
    name: planning-service
  datasource:
    url: jdbc:postgresql://localhost:5432/planning_db
    username: smartstudy
    password: smartstudy
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: localhost
    port: 5672
    username: smartstudy
    password: smartstudy

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
