spring:
  application:
    name: planning-service
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  # Powers StudyPlannerAgent, which uses the Spring AI ChatClient to turn PDF text
  # into study tasks. This is a SEPARATE Gemini path from the chat tutor, which
  # talks to the REST API through its own RestClient and reads the `gemini:` block
  # below. The two take different keys: this one SPRING_AI_GOOGLE_GEMINI_API_KEY,
  # the tutor GEMINI_API_KEY. Setting one does not cover the other — task
  # generation and chat fail independently.
  ai:
    google:
      genai:
        api-key: ${SPRING_AI_GOOGLE_GEMINI_API_KEY:}
        chat:
          options:
            model: gemini-3.1-flash-lite
            temperature: 0.2
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${PLANNING_DB_NAME:planning_db}
    username: ${POSTGRES_USER:smartstudy}
    password: ${POSTGRES_PASSWORD:smartstudy}
  jpa:
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 5
    locations: classpath:db/migration

server:
  port: ${PORT:8082}
  address: 0.0.0.0
  tomcat:
    max-http-form-post-size: 50MB

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:planning-service.railway.internal}

management:
  endpoints:
    web:
      exposure:
        include: health,info

smartstudy:
  agent:
    min-split-minutes: 1
    max-split-minutes: 60
  url-course:
    min-split-minutes: 1
    max-split-minutes: 60

# --- AI Processing Pipeline ---

gemini:
  # Empty default on purpose: a missing key must surface as the explicit
  # "GEMINI_API_KEY is not configured" message from AiPipelineConfig, not as an
  # unresolved-placeholder failure that hides the cause.
  api-key: ${GEMINI_API_KEY:}
  embedding:
    model: gemini-embedding-001
    batch-size: 100
  vision:
    model: gemini-2.0-flash
  chat:
    # Must be an ID the deployed key can actually reach. gemini-2.0-flash sat here
    # until it was retired, which 404'd the entire Gemini chain and pushed all chat
    # traffic onto the OpenRouter fallback.
    model: ${GEMINI_CHAT_MODEL:gemini-3.5-flash-lite}
    max-output-tokens: 2048
    temperature: 0.3

openrouter:
  api-key: ${OPENROUTER_API_KEY:}
  base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}

storage:
  materials:
    base-dir: ${MATERIAL_STORAGE_DIR:uploads/materials}

qdrant:
  host: ${QDRANT_HOST:localhost}
  port: ${QDRANT_PORT:6334}
  collection-name: material_chunks

processing:
  poll-interval-ms: ${PROCESSING_POLL_INTERVAL:5000}
  retry-interval-ms: ${PROCESSING_RETRY_INTERVAL:1800000}
  max-retries: ${PROCESSING_MAX_RETRIES:3}

# --- AI Chat ---
chat:
  history-context-size: 20
  qdrant-search-limit: 5
  qdrant-score-threshold: 0.5
