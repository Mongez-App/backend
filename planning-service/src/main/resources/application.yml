spring:
  application:
    name: planning-service
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  ai:
    google:
      genai:
        api-key: ${SPRING_AI_GOOGLE_GEMINI_API_KEY:}
        chat:
          options:
            model: gemini-3.1-flash-lite
            temperature: 0.2
  jpa:
    open-in-view: false

server:
  port: ${PORT:8082}
  address: 0.0.0.0
  tomcat:
    max-http-form-post-size: 25MB

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

smartstudy:
  agent:
    min-split-minutes: 1
    max-split-minutes: 60
  url-course:
    min-split-minutes: 1
    max-split-minutes: 60
